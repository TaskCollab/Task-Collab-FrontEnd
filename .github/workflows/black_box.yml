name: React CI/CD with Cypress E2E

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your desired Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Start development server (background)
        run: npm start &
        env:
          PORT: 3000 # Ensure the server starts on a specific port

      - name: Wait for development server to start
        run: |
          npx wait-on http://localhost:3000

      - name: Install Cypress
        run: npx cypress install

      - name: Run Cypress E2E tests
        run: npx cypress run

      - name: Stop development server
        if: ${{ always() }}
        run: pkill -f "npm start"